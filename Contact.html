<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | College Event Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">CollegeEvents</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Contact Us</h1>
    <div class="contact-wrap">
      <div class="card">
        <h3>Event Committee</h3>
        <p>Email: events@college.edu</p>
        <p>Phone: +91 98765 43210</p>
        <p>Address: College Campus, Tamil Nadu, India</p>
      </div>
      <form id="contactForm" class="form-box" novalidate>
        <label for="cName">Name</label>
        <input type="text" id="cName" placeholder="Your name">
        <label for="cEmail">Email</label>
        <input type="email" id="cEmail" placeholder="you@example.com">
        <label for="cMsg">Message</label>
        <textarea id="cMsg" rows="4" placeholder="Your message"></textarea>
        <button type="submit">Send</button>
        <p id="contactMsg"></p>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 College Event Portal</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
